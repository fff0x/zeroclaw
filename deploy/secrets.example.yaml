---
# PREREQUISITE SECRET — fill in and create BEFORE `kubectl apply -k deploy`.
# Intentionally NOT in kustomization.yaml so placeholders are never applied. Manage
# the real values with SOPS / sealed-secrets / an external secret store.
#
# Keys are consumed two ways: directly as the daemon's env, AND substituted into
# config.toml by the init container (envsubst). Only OLLAMA_API_KEY is strictly
# required; the MATRIX_* keys are only needed if the matrix channel is enabled.
apiVersion: v1
kind: Secret
metadata:
  name: zeroclaw-secrets
type: Opaque
stringData:
  OLLAMA_API_KEY: "CHANGE_ME"
  # --- Matrix channel (optional; remove if you disable [channels.matrix.default]) ---
  MATRIX_HOMESERVER: "https://matrix.<domain.tld>"
  MATRIX_USER_ID: "@bot:<domain.tld>"
  MATRIX_PASSWORD: "CHANGE_ME"
  MATRIX_ACCESS_TOKEN: "CHANGE_ME"
  MATRIX_DEVICE_ID: "CHANGE_ME"
  MATRIX_RECOVERY_KEY: "CHANGE_ME"
  MATRIX_ALLOWED_ROOM: "!roomid:<domain.tld>"
  MATRIX_ALLOWED_USER: "@you:<domain.tld>"
